apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: akspracticeacr26abin.azurecr.io/backend:v1


        ports:
        - containerPort: 8000

        envFrom:
        - secretRef:
            name: sql-secret